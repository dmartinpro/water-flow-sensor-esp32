<text x="914" y="154" font-size="12" font-weight="bold" fill="#666">Not in phase 1 (report-only)</text>
<text x="914" y="172" font-size="11" fill="#666">Later: a relay on a spare GPIO into the</text>
<text x="914" y="190" font-size="11" fill="#666">pump controller's low-voltage interlock,</text>
<text x="914" y="208" font-size="11" fill="#666">gated by no_flow_alarm AND "pump should</text>
<text x="914" y="226" font-size="11" fill="#666">run". Fail-safe: relay energised = run,</text>
<text x="914" y="244" font-size="11" fill="#666">so losing ESP32 power stops the pump.</text>
<text x="600" y="812" text-anchor="middle" font-size="11" fill="#555">Pin positions drawn for the common 38-pin ESP32-DevKitC layout. Check the silkscreen on your board: only 5V, GND, 3V3 and GPIO4 are used.</text>
<text x="600" y="830" text-anchor="middle" font-size="11" fill="#555">The micro-USB port is for flashing and bench power only. In service the board is powered through its 5V pin.</text>

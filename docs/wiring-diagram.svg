<rect x="56" y="265" width="10" height="10" fill="#222"/><text x="74" y="274" font-size="11" fill="#222">Buck OUT−  →  board GND</text>
<rect x="56" y="285" width="10" height="10" fill="#999"/><text x="74" y="294" font-size="11" fill="#222">PSU  →  buck IN+ / IN−</text>
